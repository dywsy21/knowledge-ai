services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-ai-backend
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: bridge
    ports:
      - "127.0.0.1:18881:8800"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: bridge
    ports:
      - "127.0.0.1:18880:80"
